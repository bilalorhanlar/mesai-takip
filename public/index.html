<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Iron Lounge">
<title>Iron Lounge · Mesai</title>
<link rel="icon" href="logo-dark.png">
<link rel="apple-touch-icon" href="logo-dark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="db.js"></script>
</head>
<body class="staff">
<div class="staff-bg"></div>
<main class="staff-wrap">
  <header class="staff-head">
    <img src="logo-dark.png" alt="Iron Lounge" class="staff-logo">
    <div class="clock"><span class="clock-time" id="clock">--:--</span><span class="clock-date" id="date"></span></div>
  </header>

  <div class="staff-body">
    <!-- 1) Kod girişi (ilk kullanım) -->
    <section id="v-code" class="view" hidden>
      <p class="eyebrow">Hoş geldiniz</p>
      <h1 class="title">Personel kodunuz</h1>
      <div class="dots" id="dots"><span></span><span></span><span></span><span></span></div>
      <p class="msg err" id="code-err"></p>
      <div class="pad" id="pad">
        <button>1</button><button>2</button><button>3</button>
        <button>4</button><button>5</button><button>6</button>
        <button>7</button><button>8</button><button>9</button>
        <span></span><button>0</button><button data-k="del" aria-label="Sil">⌫</button>
      </div>
    </section>

    <!-- 2) Mesaiye başla -->
    <section id="v-main" class="view" hidden>
      <h1 class="hello"><span id="greet">Merhaba</span>,<br><em id="name"></em></h1>
      <span class="shift" id="shift"></span>
      <div class="start-zone" id="zone">
        <span class="ring r2"></span><span class="ring"></span>
        <button class="start" id="start">
          <svg class="ico" id="ico" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></svg>
          <span class="lbl" id="lbl"></span>
          <span class="sub" id="sub"></span>
        </button>
      </div>
      <p class="msg" id="msg"></p>
    </section>

    <!-- 3) Başarılı -->
    <section id="v-ok" class="view stagger" hidden>
      <div class="success" id="success">
        <span class="burst"></span><span class="burst b2"></span>
        <div class="disc"><svg viewBox="0 0 52 52"><path d="M14 27 l8 8 l16 -18"/></svg></div>
      </div>
      <p class="ok-title">İyi çalışmalar, <span id="ok-name"></span></p>
      <p class="ok-time" id="ok-time"></p>
      <p class="ok-sub" id="ok-late"></p>
    </section>
  </div>

  <footer class="staff-foot">Mesai Takip</footer>
</main>

<script>
const $ = (id) => document.getElementById(id);
const KEY = 'ironlounge_staff';
const TZ = 'Europe/Istanbul';
const fmt = (iso) => new Date(iso).toLocaleTimeString('tr-TR', { timeZone: TZ, hour: '2-digit', minute: '2-digit' });
const ICONS = {
  play: '<circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l5.5-3.5z"/>',
  pin: '<path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>',
  check: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16.5 9.5"/>',
};

function getMe() { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } }
function setMe(v) { try { v ? localStorage.setItem(KEY, JSON.stringify(v)) : localStorage.removeItem(KEY); } catch {} }
function show(id) { document.querySelectorAll('.view').forEach(v => v.hidden = v.id !== id); }
const buzz = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };

// SQL fonksiyonları {status, ...} döner
async function call(fn, args) {
  const data = await rpc(fn, args);
  return { ok: data.status === 200, status: data.status, data };
}

// ---- Saat ----
function tick() {
  const d = new Date();
  $('clock').textContent = d.toLocaleTimeString('tr-TR', { timeZone: TZ, hour: '2-digit', minute: '2-digit' });
  $('date').textContent = d.toLocaleDateString('tr-TR', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long' });
  const h = Number(d.toLocaleString('en-GB', { timeZone: TZ, hour: '2-digit', hourCycle: 'h23' }));
  $('greet').textContent = h < 12 ? 'Günaydın' : h < 18 ? 'İyi günler' : 'İyi akşamlar';
}
tick(); setInterval(tick, 10000);

// ---- Kod girişi ----
let code = '';
function renderDots() { [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i < code.length)); }
$('pad').addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  buzz(8);
  $('code-err').textContent = '';
  if (b.dataset.k === 'del') code = code.slice(0, -1);
  else if (code.length < 4) code += b.textContent;
  renderDots();
  if (code.length === 4) {
    const { ok, data } = await call('staff_status', { p_code: code }).catch((e) => ({ ok: false, data: { error: e.message } }));
    if (ok) { setMe({ code, name: data.name }); code = ''; renderDots(); loadMain(data); }
    else {
      buzz([40, 40, 40]);
      $('code-err').textContent = data.error || 'Hata';
      $('dots').classList.add('shake');
      setTimeout(() => { $('dots').classList.remove('shake'); code = ''; renderDots(); }, 450);
    }
  }
});

// ---- Ana ekran ----
function setButton(icon, lbl, sub = '') { $('ico').innerHTML = ICONS[icon]; $('lbl').innerHTML = lbl; $('sub').textContent = sub; }
function loadMain(info) {
  const me = getMe();
  const name = info.name || me.name;
  $('name').textContent = name.split(' ')[0];
  const times = `${info.shiftStart} – ${info.shiftEnd}`;
  // Vardiya adı zaten saatlerden oluşuyorsa tekrar etme
  $('shift').textContent = !info.shiftStart ? '' : !info.shiftName || info.shiftName.includes(info.shiftStart) ? `Vardiya ${times}` : `${info.shiftName} · ${times}`;
  $('shift').hidden = !info.shiftStart;
  $('msg').textContent = info.onLeave && !info.onShift ? 'Bugün izin gününüz 🌿' : ''; $('msg').className = 'msg';
  setOnShift(info.onShift, info.checkIn);
  show('v-main');
}
function setOnShift(on, checkIn) {
  $('start').disabled = !!on;
  $('start').classList.toggle('done', !!on);
  $('zone').classList.toggle('done', !!on);
  if (on) setButton('check', 'Mesaidesiniz', `Giriş ${fmt(checkIn)}`);
  else setButton('play', 'Mesaiye<br>Başla');
}

function getPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error('Bu cihaz konum desteklemiyor'));
    navigator.geolocation.getCurrentPosition(resolve, (err) => {
      const m = { 1: 'Konum izni verilmedi. Tarayıcı ayarlarından konum iznini açın.', 2: 'Konum bulunamadı. GPS açık mı?', 3: 'Konum zaman aşımı. Tekrar deneyin.' };
      reject(new Error(m[err.code] || 'Konum alınamadı'));
    }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  });
}

function playSuccess(data) {
  const me = getMe();
  $('ok-name').textContent = (data.name || me.name).split(' ')[0];
  $('ok-time').textContent = fmt(data.checkIn);
  $('ok-late').textContent = data.late > 0 ? `${data.late} dk geç giriş kaydedildi` : 'Girişiniz kaydedildi';
  $('ok-late').className = 'ok-sub' + (data.late > 0 ? ' msg late' : '');
  const s = $('success');
  s.querySelectorAll('.confetti').forEach((c) => c.remove());
  const colors = ['#3b4a2c', '#9a9364', '#d8d2ad', '#56663f', '#c9c3a0'];
  for (let i = 0; i < 26; i++) {
    const c = document.createElement('span');
    c.className = 'confetti';
    const a = (Math.PI * 2 * i) / 26 + Math.random() * .3, dist = 110 + Math.random() * 90;
    c.style.cssText = `--x:${Math.cos(a) * dist}px;--y:${Math.sin(a) * dist}px;--r:${Math.random() * 540 - 270}deg;background:${colors[i % colors.length]};animation-delay:${.25 + Math.random() * .15}s;${i % 3 ? '' : 'border-radius:50%;'}`;
    s.appendChild(c);
  }
  s.classList.remove('play'); void s.offsetWidth; s.classList.add('play');
  show('v-ok');
  buzz([30, 60, 80]);
  setTimeout(() => refresh(), 7000);
}

$('start').addEventListener('click', async () => {
  const me = getMe(); if (!me) return show('v-code');
  const btn = $('start');
  buzz(15);
  btn.disabled = true; btn.classList.add('busy');
  setButton('pin', 'Konum<br>alınıyor');
  $('msg').textContent = ''; $('msg').className = 'msg';
  try {
    const pos = await getPosition();
    const { ok, status, data } = await call('staff_checkin', { p_code: me.code, p_lat: pos.coords.latitude, p_lng: pos.coords.longitude, p_accuracy: pos.coords.accuracy });
    btn.classList.remove('busy');
    if (ok) return playSuccess(data);
    if (status === 404) { setMe(null); show('v-code'); $('code-err').textContent = 'Kodunuz geçersiz, tekrar girin.'; return; }
    if (status === 409) return setOnShift(true, data.checkIn);
    throw new Error(data.error || 'Giriş yapılamadı');
  } catch (e) {
    btn.classList.remove('busy');
    buzz([40, 40, 40]);
    $('msg').textContent = e.message; $('msg').className = 'msg err';
    btn.disabled = false; setButton('play', 'Tekrar<br>Dene');
  }
});

async function refresh() {
  const me = getMe();
  if (!me) return show('v-code');
  const { ok, status, data } = await call('staff_status', { p_code: me.code }).catch(() => ({ ok: false }));
  if (ok) { setMe({ ...me, name: data.name }); loadMain(data); }
  else if (status === 404) { setMe(null); show('v-code'); }
  else loadMain({ name: me.name });
}
refresh();
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('v-main').hidden) refresh(); });
</script>
</body>
</html>
